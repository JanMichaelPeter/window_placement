name: Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.1

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Generated Pigeon code (*.g.dart) keeps its own formatting.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' ':!:*.g.dart')
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle config
        working-directory: example
        run: flutter build apk --config-only
      - name: Kotlin unit tests
        working-directory: example/android
        run: ./gradlew :window_placement:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: example
          script: flutter test integration_test -d emulator-5554

  ios:
    name: iOS (${{ matrix.dependency-manager }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dependency-manager: [CocoaPods, Swift Package Manager]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The example uses Swift Package Manager. To check that the plugin still
      # works with CocoaPods, switch it off and bring back the Podfile.
      - name: Switch example to CocoaPods
        if: matrix.dependency-manager == 'CocoaPods'
        working-directory: example
        run: |
          sed -i '' 's/enable-swift-package-manager: true/enable-swift-package-manager: false/' pubspec.yaml
          cp ../.github/ci/Podfile ios/Podfile
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      # Also runs pod install, or adds the Swift package integration.
      - name: Generate Xcode config
        working-directory: example
        run: flutter build ios --config-only --simulator
      - name: Swift unit tests
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO
      # xcodebuild test shuts the simulator down when it finishes.
      - name: Boot simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Integration tests on simulator
        working-directory: example
        run: flutter test integration_test -d "$SIMULATOR_UDID"
