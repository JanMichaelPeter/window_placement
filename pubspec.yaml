name: window_placement
description: "A Flutter plugin capable of telling where an app is displayed on a mobile device display"
version: 0.0.2
repository: https://github.com/JanMichaelPeter/window_placement
issue_tracker: https://github.com/JanMichaelPeter/window_placement/issues

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only for regenerating the bindings; 26 is the last for Dart 3.9.
  pigeon: ">=26.3.4 <28.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: io.github.janmichaelpeter.window_placement
        pluginClass: WindowPlacementPlugin
      ios:
        pluginClass: WindowPlacementPlugin
  config:
    enable-swift-package-manager: true
